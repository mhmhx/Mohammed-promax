<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إرسال خبر</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Tahoma;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00adb5;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border-radius: 10px;
      background: #1f1f1f;
      color: white;
      border: none;
      margin-bottom: 15px;
    }
    button {
      background: #00adb5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    a {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #00adb5;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>إرسال خبر جديد</h1>
    <textarea id="text" placeholder="اكتب الخبر..."></textarea>
    <button onclick="sendNews()">إرسال</button>
    <p id="result"></p>
    <a href="index.html">رجوع</a>
  </div>

  <script>
    function sendNews() {
      const text = document.getElementById('text').value;
      fetch('/send-news', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('result').innerText = data.message;
        document.getElementById('text').value = '';
      });
    }
  </script>
</body>
</html>
